# Одна VM: база, API, воркер, Telegram, панель и публичный HTTPS через Caddy.
# Секреты живут только в .env на сервере; наружу открыты только 80/443.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: repricer
      POSTGRES_USER: repricer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      # Остальные сервисы ждут, пока база действительно начнёт отвечать.
      test: ["CMD-SHELL", "pg_isready -U repricer -d repricer"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://repricer:${POSTGRES_PASSWORD}@db:5432/repricer
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: uvicorn repricer.api.app:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://repricer:${POSTGRES_PASSWORD}@db:5432/repricer
      REPRICER_API_KEY: ${REPRICER_API_KEY:?задайте REPRICER_API_KEY в .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: repricer
    environment:
      DATABASE_URL: postgresql+psycopg://repricer:${POSTGRES_PASSWORD}@db:5432/repricer
      FEED_DIR: /app/feeds
      FEED_BASE_URL: https://${SITE_DOMAIN:?задайте SITE_DOMAIN в .env}/feed
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?задайте TELEGRAM_BOT_TOKEN в .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  bot:
    build: .
    command: repricer-bot
    environment:
      DATABASE_URL: postgresql+psycopg://repricer:${POSTGRES_PASSWORD}@db:5432/repricer
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?задайте TELEGRAM_BOT_TOKEN в .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
      REPRICER_API_KEY: ${REPRICER_API_KEY}
      DASHBOARD_USER: ${DASHBOARD_USER:-owner}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?задайте DASHBOARD_PASSWORD в .env}
      FEED_PUBLIC_URL: https://${SITE_DOMAIN:?задайте SITE_DOMAIN в .env}/feed/kaspi.xml
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?задайте SITE_DOMAIN в .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
