# Весь репрайсер одной командой: docker compose up -d
#
# Перед запуском скопируйте .env.example в .env и задайте REPRICER_API_KEY,
# DASHBOARD_PASSWORD и POSTGRES_PASSWORD. Остальное заказчик заполнит в панели.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: repricer
      POSTGRES_USER: repricer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Остальные сервисы ждут, пока база действительно начнёт отвечать.
      test: ["CMD-SHELL", "pg_isready -U repricer -d repricer"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://repricer:${POSTGRES_PASSWORD}@db:5432/repricer
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: uvicorn repricer.api.app:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://repricer:${POSTGRES_PASSWORD}@db:5432/repricer
      REPRICER_API_KEY: ${REPRICER_API_KEY:?задайте REPRICER_API_KEY в .env}
    ports:
      # Наружу смотрит только фид: его забирает Kaspi. Остальное закрыто ключом.
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: repricer
    environment:
      DATABASE_URL: postgresql+psycopg://repricer:${POSTGRES_PASSWORD}@db:5432/repricer
      FEED_DIR: /app/feeds
    volumes:
      - feeds:/app/feeds
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  bot:
    build: .
    command: repricer-bot
    environment:
      DATABASE_URL: postgresql+psycopg://repricer:${POSTGRES_PASSWORD}@db:5432/repricer
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
      REPRICER_API_KEY: ${REPRICER_API_KEY}
      DASHBOARD_USER: ${DASHBOARD_USER:-owner}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?задайте DASHBOARD_PASSWORD в .env}
      FEED_PUBLIC_URL: ${FEED_PUBLIC_URL:-http://localhost:8000/feed/kaspi.xml}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  feeds:
