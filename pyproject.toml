[project]
name = "kaspi-repricer"
version = "0.1.0"
description = "Automated competitor-driven repricing for Kaspi.kz merchants"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "curl_cffi>=0.16",
    "loguru>=0.7",
    "typer>=0.12",
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
    "alembic>=1.13",
    "aiogram>=3.13",
]

[project.scripts]
repricer = "repricer.cli:app"
repricer-bot = "repricer.telegram.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repricer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
